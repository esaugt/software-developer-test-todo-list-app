version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: todo-db
    command: ["postgres", "-c", "fsync=off", "-c", "full_page_writes=off", "-c", "synchronous_commit=off"]
    environment:
      POSTGRES_DB: ${DB_NAME:-todo}
      POSTGRES_USER: ${DB_USER:-todo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-todo}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./todo-list-app-api
      dockerfile: Dockerfile.dev
    container_name: todo-api
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_NAME:-todo}
      DB_USERNAME: ${DB_USER:-todo}
      DB_PASSWORD: ${DB_PASSWORD:-todo}
    working_dir: /var/www/html
    volumes:
      - ./todo-list-app-api:/var/www/html:delegated
      - vendor:/var/www/html/vendor
    depends_on:
      - db

  webserver:
    image: nginx:alpine
    container_name: todo-nginx
    volumes:
      - ./todo-list-app-api:/var/www/html:delegated
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8000:80"         
    depends_on:
      - api

  web:
    image: node:20-alpine
    container_name: todo-web
    working_dir: /usr/src/app
    environment:
      NODE_ENV: development
    volumes:
      - ./frontend-todo-list-app:/usr/src/app:cached
      - node_modules:/usr/src/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - api
      - webserver

volumes:
  pgdata:
  vendor:
  node_modules:
